# Build settings. These override whatever is set in the Netlify UI.
# The typecheck gate runs before the Vite build because esbuild strips types
# without checking them — a missing import builds fine and crashes at runtime.
[build]
  command = "npm run typecheck && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
