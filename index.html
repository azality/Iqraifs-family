    <!-- Link previews (WhatsApp/Facebook read these without running the
         app). Defaults are the platform's; the Cloudflare Worker
         (worker/index.js) rewrites them to the SCHOOL's own name and
         logo when the URL names one (?org=<slug> or /<slug>), so a
         shared login link previews as the school parents know. -->
    <meta name="description" content="The school platform for homework, grades, attendance and Hifz progress." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ILM Network" />
    <meta property="og:title" content="ILM Network" />
    <meta property="og:description" content="The school platform for homework, grades, attendance and Hifz progress." />
    <meta property="og:image" content="https://iqraifs.com/brand/og-image.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
