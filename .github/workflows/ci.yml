name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Gate: fails on any type error not already in tsc-baseline.json.
      # (esbuild/Vite don't type-check, so `npm run build` alone lets
      # missing-import ReferenceErrors ship.)
      - run: npm run typecheck

      # The unit tests never ran here, so every rule they pin — the two
      # product hostnames, the para ranges, the permission matrix — was
      # only ever checked on a laptop. Vitest only; the Deno backend
      # tests stay local so CI doesn't have to install a second runtime.
      - run: npx vitest run

      - run: npm run build
